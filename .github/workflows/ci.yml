# Align CI. Owner: QA agent (task Q-01).
#
# Diagnostics policy: the Lead reads CI through the public, unauthenticated GitHub API, which
# exposes run/job/step status and check-run annotations but NOT raw logs. So every failure must
# surface as an annotation:
#   - xcodebuild / swift output goes through `xcbeautify --renderer github-actions` (macOS);
#   - Linux and shellcheck output goes through scripts/ci/annotate-diagnostics.sh;
#   - Maven/JUnit output: the surefire summary line becomes a notice;
#   - every job ends with an `if: failure()` step that posts the error lines + tail of the last
#     raw log as one annotation (scripts/ci/annotate-log-tail.sh) and uploads logs/.xcresult.
# Read results with: scripts/ci-status.sh [branch]

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # bash --noprofile --norc -eo pipefail
    shell: bash

# Runner images are pinned (not *-latest): ubuntu-latest started moving to Ubuntu 26 on
# 2026-10-19 (runner-images#14748), which could change preinstalled toolchains under the jobs.

env:
  # Verified present on the macos-15 image (runner-images README, image 20261028): Xcode 16.4
  # is the image default (iOS 18.5 SDK). Falls back to the default with a warning if missing.
  XCODE_APP: /Applications/Xcode_16.4.app
  APP_SCHEME: Align
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No CRLF line endings in the index
        run: |
          bad="$(git ls-files --eol | awk -F '\t' '$1 ~ /^i\/(crlf|mixed)/ { print $2 }')"
          if [[ -n "$bad" ]]; then
            while IFS= read -r f; do
              echo "::error file=$f::File is committed with CRLF line endings; .gitattributes requires LF. Run: git add --renormalize ."
            done <<< "$bad"
            exit 1
          fi
          echo "All text files are LF."

      - name: Generated Xcode project is not committed (D-003)
        run: |
          tracked="$(git ls-files 'ios/*.xcodeproj/*' 'ios/*.xcworkspace/*')"
          if [[ -n "$tracked" ]]; then
            echo "::error::Generated Xcode project files are tracked (D-003 says generate with XcodeGen): $(echo "$tracked" | head -n 5 | tr '\n' ' ')"
            exit 1
          fi

      - name: Shellcheck scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [[ ${#scripts[@]} -eq 0 ]]; then echo "No shell scripts."; exit 0; fi
          if ! command -v shellcheck >/dev/null; then
            echo "::warning title=shellcheck missing::shellcheck is not installed on this image; skipping."
            exit 0
          fi
          shellcheck --version | head -n 2
          shellcheck -f gcc --severity=warning "${scripts[@]}" | bash scripts/ci/annotate-diagnostics.sh

  java:
    name: Java (analytics/align-tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: analytics/align-tools/pom.xml

      - name: mvnw verify
        working-directory: analytics/align-tools
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          java -version 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/java-version.log"
          ./mvnw -B -ntp verify 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/maven-verify.log"

      - name: Summarize JUnit results
        if: always()
        run: |
          # Surefire's overall line ("Tests run: N, Failures: F, Errors: E, Skipped: S"); the
          # per-class lines also carry "Time elapsed" and are excluded by the anchor.
          summary="$(grep -E 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$' ci-logs/maven-verify.log 2>/dev/null | tail -n 1 | sed -E 's/^\[[A-Z]+\] //' || true)"
          echo "::notice title=JUnit (align-tools)::${summary:-no surefire summary line found}"

      - name: Annotate failure
        if: failure()
        run: |
          log="$(ls -t ci-logs/*.log 2>/dev/null | head -n 1 || true)"
          bash scripts/ci/annotate-log-tail.sh "${log:-ci-logs/none.log}" "java: $(basename "${log:-no log}")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: java-logs
          path: |
            ci-logs/
            analytics/align-tools/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  server:
    name: Sync server (server/, PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: align_test
          POSTGRES_USER: align
          # Throwaway database inside the job; not a secret.
          POSTGRES_PASSWORD: align-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U align -d align_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The suite defaults to in-memory H2; these point the same tests at the PostgreSQL service,
      # and DatabaseEngineTest fails if they did not take effect.
      ALIGN_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/align_test
      ALIGN_TEST_DATABASE_USERNAME: align
      ALIGN_TEST_DATABASE_PASSWORD: align-ci
      ALIGN_TEST_EXPECT_DATABASE: PostgreSQL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: mvnw verify (against PostgreSQL)
        working-directory: server
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          java -version 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/server-java-version.log"
          ./mvnw -B -ntp verify 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/server-maven-verify.log"

      - name: Summarize JUnit results
        if: always()
        run: |
          summary="$(grep -E 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$' ci-logs/server-maven-verify.log 2>/dev/null | tail -n 1 | sed -E 's/^\[[A-Z]+\] //' || true)"
          database="$(grep -oE '\[align-server tests\] database: .*' ci-logs/server-maven-verify.log 2>/dev/null | head -n 1 | sed -E 's/^\[align-server tests\] database: //' || true)"
          echo "::notice title=JUnit (server)::${summary:-no surefire summary line found} on ${database:-unknown database}"

      - name: Annotate failure
        if: failure()
        run: |
          log="$(ls -t ci-logs/*.log 2>/dev/null | head -n 1 || true)"
          bash scripts/ci/annotate-log-tail.sh "${log:-ci-logs/none.log}" "server: $(basename "${log:-no log}")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: server-logs
          path: |
            ci-logs/
            server/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  swift-package:
    name: Swift package (macOS + iOS Simulator build)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          if [[ -d "$XCODE_APP" ]]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "::warning title=Xcode not found::$XCODE_APP is not on this image; using default $(xcode-select -p)."
          fi
          xcodebuild -version
          swift --version
          mkdir -p ci-logs

      - name: Ensure xcbeautify
        run: |
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcbeautify --version

      - name: swift build (incl. tests)
        working-directory: ios/AlignKit
        run: |
          swift build --build-tests 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/swift-build.log" \
            | xcbeautify --renderer github-actions

      - name: swift test
        working-directory: ios/AlignKit
        run: |
          swift test 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/swift-test.log" \
            | xcbeautify --renderer github-actions

      - name: Summarize XCTest results
        if: always()
        run: |
          # xcbeautify's "0 tests" line is the Swift Testing summary; surface XCTest's own.
          summary="$(grep -E 'Executed [0-9]+ tests?' "$GITHUB_WORKSPACE/ci-logs/swift-test.log" | tail -n 1 || true)"
          echo "::notice title=XCTest (macOS package)::${summary:-no XCTest summary line found}"

      - name: Build package for iOS Simulator (compiles #if os(iOS) code)
        working-directory: ios/AlignKit
        run: |
          xcodebuild -list -json > "$GITHUB_WORKSPACE/ci-logs/package-schemes.json"
          # Multi-product packages get an aggregate "<Package>-Package" scheme; if it is
          # missing, build each library scheme instead.
          schemes="$(python3 -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          schemes = (d.get("workspace") or d.get("project") or {}).get("schemes", [])
          print("Available schemes: %s" % schemes, file=sys.stderr)
          libs = ["AlignCore", "PostureDetection", "Sensors"]
          chosen = ["AlignKit-Package"] if "AlignKit-Package" in schemes else [s for s in libs if s in schemes]
          print("\n".join(chosen))
          ' "$GITHUB_WORKSPACE/ci-logs/package-schemes.json")"
          if [[ -z "$schemes" ]]; then
            echo "::error title=No package scheme::xcodebuild -list found neither AlignKit-Package nor the library schemes in ios/AlignKit."
            exit 1
          fi
          while IFS= read -r scheme; do
            echo "Building scheme $scheme for iOS Simulator"
            xcodebuild build \
                -scheme "$scheme" \
                -destination 'generic/platform=iOS Simulator' \
                -derivedDataPath "$RUNNER_TEMP/dd-package" \
                CODE_SIGNING_ALLOWED=NO 2>&1 \
              | tee "$GITHUB_WORKSPACE/ci-logs/package-ios-build-$scheme.log" \
              | xcbeautify --renderer github-actions
          done <<< "$schemes"

      - name: Annotate failure
        if: failure()
        run: |
          log="$(ls -t ci-logs/*.log 2>/dev/null | head -n 1 || true)"
          bash scripts/ci/annotate-log-tail.sh "${log:-ci-logs/none.log}" "swift-package: $(basename "${log:-no log}")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: swift-package-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  swift-linux:
    name: Swift package (Linux, non-blocking)
    runs-on: ubuntu-24.04
    container: swift:5.10-jammy
    # Non-blocking for now: Linux is not a shipping platform, it only proves that AlignCore and
    # PostureDetection stay platform-independent. Make it blocking once it has been green.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          swift --version
          mkdir -p ci-logs

      - name: swift build (incl. tests)
        working-directory: ios/AlignKit
        run: |
          swift build --build-tests 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/linux-swift-build.log" \
            | bash "$GITHUB_WORKSPACE/scripts/ci/annotate-diagnostics.sh"

      - name: swift test
        working-directory: ios/AlignKit
        run: |
          swift test 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/linux-swift-test.log" \
            | bash "$GITHUB_WORKSPACE/scripts/ci/annotate-diagnostics.sh"

      - name: Annotate failure
        if: failure()
        run: |
          log="$(ls -t ci-logs/*.log 2>/dev/null | head -n 1 || true)"
          bash scripts/ci/annotate-log-tail.sh "${log:-ci-logs/none.log}" "swift-linux: $(basename "${log:-no log}")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: swift-linux-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  ios-app:
    name: iOS app (XcodeGen, build + unit tests)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect app project
        id: detect
        run: |
          mkdir -p ci-logs
          if [[ -f ios/project.yml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS app skipped::ios/project.yml does not exist yet (Frontend agent, F-01)."
          fi

      - name: Select Xcode and tools
        if: steps.detect.outputs.present == 'true'
        run: |
          if [[ -d "$XCODE_APP" ]]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "::warning title=Xcode not found::$XCODE_APP is not on this image; using default $(xcode-select -p)."
          fi
          xcodebuild -version
          command -v xcbeautify >/dev/null || brew install xcbeautify
          command -v xcodegen >/dev/null || brew install xcodegen
          xcbeautify --version
          xcodegen --version

      - name: xcodegen generate
        if: steps.detect.outputs.present == 'true'
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/xcodegen.log"
          if [[ ! -d Align.xcodeproj ]]; then
            echo "::error file=ios/project.yml,title=Project name::xcodegen did not create ios/Align.xcodeproj (found: $(ls -d ./*.xcodeproj 2>/dev/null | tr '\n' ' ')). Set 'name: Align' in project.yml."
            exit 1
          fi
          xcodebuild -list -project Align.xcodeproj -json > "$GITHUB_WORKSPACE/ci-logs/xcodebuild-list.json"
          if ! python3 -c '
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          schemes = d.get("project", {}).get("schemes", [])
          print("Schemes:", schemes)
          sys.exit(0 if os.environ["APP_SCHEME"] in schemes else 1)
          ' "$GITHUB_WORKSPACE/ci-logs/xcodebuild-list.json"; then
            echo "::error file=ios/project.yml,title=Scheme missing::Generated Align.xcodeproj has no shared scheme '$APP_SCHEME'. Define it in project.yml (schemes: or targets.<name>.scheme) including the test targets."
            exit 1
          fi

      - name: Pick iPhone simulator
        if: steps.detect.outputs.present == 'true'
        id: sim
        working-directory: ios
        run: |
          dest="$(python3 "$GITHUB_WORKSPACE/scripts/ci/pick-simulator.py" --project Align.xcodeproj --scheme "$APP_SCHEME")"
          echo "Destination: $dest"
          echo "destination=$dest" >> "$GITHUB_OUTPUT"

      - name: Build app
        if: steps.detect.outputs.present == 'true'
        working-directory: ios
        run: |
          xcodebuild build \
              -project Align.xcodeproj \
              -scheme "$APP_SCHEME" \
              -destination "${{ steps.sim.outputs.destination }}" \
              -derivedDataPath "$RUNNER_TEMP/dd-app" \
              CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/app-build.log" \
            | xcbeautify --renderer github-actions

      - name: Test app
        if: steps.detect.outputs.present == 'true'
        working-directory: ios
        run: |
          xcodebuild test \
              -project Align.xcodeproj \
              -scheme "$APP_SCHEME" \
              -destination "${{ steps.sim.outputs.destination }}" \
              -derivedDataPath "$RUNNER_TEMP/dd-app" \
              -resultBundlePath "$GITHUB_WORKSPACE/ci-logs/AlignTests.xcresult" \
              CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/app-test.log" \
            | xcbeautify --renderer github-actions

      - name: Summarize app XCTest results
        if: always() && steps.detect.outputs.present == 'true'
        run: |
          summary="$(grep -E 'Executed [0-9]+ tests?' "$GITHUB_WORKSPACE/ci-logs/app-test.log" | tail -n 1 || true)"
          echo "::notice title=XCTest (iOS app)::${summary:-no XCTest summary line found}"

      - name: Annotate failure
        if: failure()
        run: |
          log="$(ls -t ci-logs/*.log 2>/dev/null | head -n 1 || true)"
          bash scripts/ci/annotate-log-tail.sh "${log:-ci-logs/none.log}" "ios-app: $(basename "${log:-no log}")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-app-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7
